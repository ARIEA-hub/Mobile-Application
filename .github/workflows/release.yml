name: Build & Publish Android Release

# This automation triggers every time you push a version tag starting with "v" (e.g., v1.0, v2.1.3)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK and Upload to GitHub Releases
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # Change to '11' or '21' if your Android Studio project configuration requires it

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Run unit tests and lint
      run: ./gradlew testDebugUnitTest lintDebug

    - name: Restore release signing key (if configured)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        else
          echo "No KEYSTORE_BASE64 secret: the APK will be signed with the debug key."
        fi

    - name: Build release APK and Play Store bundle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease bundleRelease

    # Google Play takes an app bundle signed with the upload key and rejects one signed with a debug
    # key, so the bundle is only kept when the real key was available.
    - name: Keep the Play Store bundle (signed builds only)
      if: env.KEYSTORE_FILE != ''
      uses: actions/upload-artifact@v4
      with:
        name: alarmboss-play-bundle
        path: app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: error
        retention-days: 30

    - name: Note that no Play Store bundle was kept
      if: env.KEYSTORE_FILE == ''
      run: echo "::warning::No signing key configured, so no Play Store bundle was kept. Add the KEYSTORE_* secrets to produce one."

    - name: Find and Print APK Path
      run: |
        echo "=== Locating built APK file paths ==="
        find . -name "*.apk"
        echo "======================================"

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
